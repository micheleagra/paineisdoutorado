<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painéis do doutorado | Michele Agra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDF1F3;
    --ink: #12304A;
    --steel: #5B7285;
    --line: #C5D0D8;
    --sea: #0E6E78;
    --row-hover: #E2E9ED;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0F1E2B;
      --ink: #E4ECF1;
      --steel: #93A8B8;
      --line: #2C4254;
      --sea: #5CC3CC;
      --row-hover: #16293A;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1.0625rem;
    line-height: 1.55;
  }
  main {
    max-width: 44rem;
    margin: 0 auto;
    padding: clamp(3rem, 10vh, 6rem) 1.5rem 3rem;
  }
  .ring { width: 72px; height: 72px; color: var(--sea); display: block; margin-bottom: 2rem; }
  h1 {
    font-family: "Source Serif 4", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0 0 1rem;
  }
  .autora { color: var(--steel); margin: 0 0 3rem; max-width: 34rem; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a.painel {
    display: grid;
    grid-template-columns: 3rem 1fr;
    gap: 1.25rem;
    align-items: center;
    padding: 1.5rem 0.75rem;
    color: inherit;
    text-decoration: none;
  }
  a.painel:hover { background: var(--row-hover); }
  a.painel:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  a.painel svg { width: 3rem; height: 3rem; color: var(--sea); }
  a.painel h2 {
    font-family: "Source Serif 4", Georgia, serif;
    font-weight: 600;
    font-size: 1.45rem;
    margin: 0 0 0.2rem;
  }
  a.painel p { margin: 0; color: var(--steel); }
  footer { margin-top: 3rem; font-size: 0.9rem; color: var(--steel); }
</style>
</head>
<body>
<main>
  <!-- seção de tubo: anel intacto sobreposto ao anel ovalizado -->
  <svg class="ring" viewBox="0 0 72 72" aria-hidden="true" fill="none" stroke="currentColor">
    <circle cx="36" cy="36" r="30" stroke-width="2" opacity="0.35"/>
    <ellipse cx="36" cy="36" rx="33" ry="20" stroke-width="3"/>
  </svg>

  <h1>Painéis do doutorado</h1>
  <p class="autora">Michele Agra de Lemos Martins, doutorado em Engenharia Oceânica na COPPE/UFRJ, Laboratório de Tecnologia Submarina.</p>

  <ul>
    <li>
      <a class="painel" href="bolsaoar.html">
        <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="20" cy="26" r="12"/><circle cx="34" cy="14" r="6"/><circle cx="36" cy="32" r="3"/>
        </svg>
        <div>
          <h2>Bolsão de ar</h2>
          <p>Painel do bolsão de ar nos ensaios.</p>
        </div>
      </a>
    </li>
    <li>
      <a class="painel" href="painel_ensaio_tracao.html">
        <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 14h10l4 6h8l4-6h10v20H32l-4-6h-8l-4 6H6z"/>
        </svg>
        <div>
          <h2>Ensaio de tração</h2>
          <p>Painel dos resultados do ensaio de tração.</p>
        </div>
      </a>
    </li>
  </ul>

  <footer>Atualizado em setembro de 2026.</footer>
</main>
</body>
</html>
